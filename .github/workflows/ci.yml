name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal -c clippy,rustfmt -t wasm32-unknown-unknown
          rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: The browser's module builds, and checks as the command line does
        run: |
          cargo build -p iecf-wasm --target wasm32-unknown-unknown --profile wasm
          wasm=target/wasm32-unknown-unknown/wasm/iecf_wasm.wasm
          echo "iecf_wasm.wasm: $(stat -c %s $wasm) bytes, $(gzip -9c $wasm | wc -c) gzipped" >> "$GITHUB_STEP_SUMMARY"
          node crates/iecf-wasm/test.mjs $wasm

  runtime:
    # iecf.h, the runtime header of the C output (docs/c-output.md): strict
    # C99 on a 64-bit host, and run on 32-bit wasm with no libc of its own.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GCC, strict C99, and undefined behaviour trapped
        run: |
          for t in image arith strings; do
            gcc -std=c99 -pedantic -Wall -Wextra -Wconversion -Wsign-conversion -Werror \
              -fsanitize=undefined,float-cast-overflow -fno-sanitize-recover=all -I runtime runtime/tests/$t.c -o $t
            ./$t
          done
      - name: wasm32, freestanding and run
        run: |
          pip install ziglang==0.16.0
          for t in image arith strings; do
            python -m ziglang cc --target=wasm32-freestanding -std=c99 -pedantic -Wall -Wextra -Werror \
              -ffreestanding -I runtime -c runtime/tests/$t.c -o $t.o
            python -m ziglang cc --target=wasm32-wasi -std=c99 -O2 -I runtime runtime/tests/$t.c -o $t.wasm
            node runtime/tests/run-wasi.mjs $t.wasm
          done

  harness:
    # matiec's traces of the harness cases (harness/README.md), confirmed
    # against matiec built at the commit they were written with.
    runs-on: ubuntu-latest
    env:
      MATIEC_COMMIT: 7949c0bda1787de9c7cacaa4876ede49f85262dd
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/cache@v4
        id: matiec
        with:
          path: matiec
          key: matiec-${{ env.MATIEC_COMMIT }}
      - name: Build matiec
        if: steps.matiec.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y bison flex
          git clone https://github.com/beremiz/matiec.git
          cd matiec
          git checkout "$MATIEC_COMMIT"
          autoreconf -i
          ./configure
          make -j"$(nproc)"
      - run: cargo run -p iecf-harness -- matiec --matiec matiec
      - name: iecf's C against the traces, strict C99, run under the sanitizers
        run: |
          printf '#!/bin/sh\nexec gcc -fsanitize=undefined,float-cast-overflow,address -fno-sanitize-recover=all "$@"\n' > "$RUNNER_TEMP/cc"
          chmod +x "$RUNNER_TEMP/cc"
          CC="$RUNNER_TEMP/cc" cargo run -p iecf-harness -- iecf
