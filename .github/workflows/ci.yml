name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal -c clippy,rustfmt -t wasm32-unknown-unknown
          rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: The front end builds for wasm
        run: cargo build -p iecf-syntax --target wasm32-unknown-unknown --release
